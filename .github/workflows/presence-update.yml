name: Presence Update

on:
  pull_request:
    types: [closed]
    paths:
      - "packages/websites/src/*/*/**"

jobs:
  update:
    if: >
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'presence')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build:websites

      - name: Detect presence changes and sync with API
        env:
          API_URL: ${{ secrets.API_URL || 'https://api.nowly.me' }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          PRESENCES="[]"
          RELEASE_AUTHOR=$(jq -n --arg name "$PR_AUTHOR" --arg github "$PR_AUTHOR" '{name: $name, github: $github}')
          RELEASE_CONTRIBUTORS=$(git log --format='%an	%ae' "$BASE"..."$HEAD" 2>/dev/null \
            | awk '!seen[$0]++' \
            | jq -R 'split("	") as $p | {name: $p[0]} + (try ($p[1] | capture("^[0-9]+\\+(?<login>[^@]+)@users\\.noreply\\.github\\.com$") | {github: .login}) catch {})' \
            | jq -s --arg prAuthor "$PR_AUTHOR" '[.[] | select((.github // "") != $prAuthor and .name != $prAuthor)]')
          COMMIT_SHA=$(git rev-parse "$HEAD")

          FILES=$(git diff --name-only --diff-filter=AMR "$BASE"..."$HEAD" -- "packages/websites/src/*/*/**" 2>/dev/null)
          SEEN=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            letter=$(echo "$file" | cut -d'/' -f4)
            name=$(echo "$file" | cut -d'/' -f5)
            dir="packages/websites/src/$letter/$name"
            meta_path="$dir/metadata.json"
            slug=$(echo "$name" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
            echo "$SEEN" | grep -q "^$slug$" && continue
            SEEN="$SEEN$slug"$'\n'

            meta_status=$(git diff --name-status "$BASE"..."$HEAD" -- "$meta_path" 2>/dev/null | head -1 | cut -f1)
            type="modified"
            [ "$meta_status" = "A" ] && type="new"

            if [ -f "$meta_path" ]; then
              name=$(jq -r '.name // ""' "$meta_path")
              author=$(jq -r '.author.name // ""' "$meta_path")
              authorGithub=$(jq -r '.author.github // ""' "$meta_path")
              desc=$(jq -r '.description["en-US"] // .description.en // (.description | to_entries[0].value) // ""' "$meta_path")

              bundle_path="packages/websites/dist/presences/$slug/bundle.js"
              if [ -f "$bundle_path" ]; then
                bundle=$(jq -Rs . < "$bundle_path")
              else
                bundle="null"
              fi
              changedFiles=$(printf '%s\n' "$FILES" | grep "^$dir/" | jq -R . | jq -s .)
              diffSummary=$(git diff --unified=3 "$BASE"..."$HEAD" -- "$dir" 2>/dev/null | head -c 12000 | jq -Rs .)

              PRESENCES=$(echo "$PRESENCES" | jq \
                --arg slug "$slug" \
                --arg type "$type" \
                --arg name "$name" \
                --arg author "$author" \
                --arg authorGithub "$authorGithub" \
                --arg desc "$desc" \
                --arg source "pr" \
                --arg commitSha "$COMMIT_SHA" \
                --argjson bundle "$bundle" \
                --argjson releaseAuthor "$RELEASE_AUTHOR" \
                --argjson releaseContributors "$RELEASE_CONTRIBUTORS" \
                --argjson changedFiles "$changedFiles" \
                --argjson diffSummary "$diffSummary" \
                '. + [{
                  slug: $slug,
                  type: $type,
                  name: $name,
                  author: $author,
                  authorGithub: $authorGithub,
                  releaseAuthor: $releaseAuthor,
                  releaseContributors: $releaseContributors,
                  description: {"en-US": $desc},
                  bundle: $bundle,
                  source: $source,
                  commitSha: $commitSha,
                  changedFiles: $changedFiles,
                  diffSummary: $diffSummary
                }]')
            fi
          done <<< "$FILES"

          if [ "$PRESENCES" = "[]" ]; then
            echo "No presences to sync"
            exit 0
          fi

          CHANGES=$(git log --oneline "$BASE"..."$HEAD" 2>/dev/null | head -20)
          BODY=$(jq -n \
            --arg pr "#$PR_NUMBER" \
            --arg prTitle "$PR_TITLE" \
            --arg changes "$CHANGES" \
            --argjson presences "$PRESENCES" \
            '{pr: $pr, prTitle: $prTitle, changes: $changes, presences: $presences}')

          echo "Syncing presences..."
          RESP=$(curl -s -X POST "$API_URL/presences/sync" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_SECRET_KEY" \
            -d "$BODY")

          echo "Response: $RESP"

      - name: Upload presences to CDN
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'nowly' }}
        run: pnpm presence r2:sync
